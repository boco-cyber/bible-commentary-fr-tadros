openapi: 3.1.0
info:
  title: Bible Commentary — Fr. Tadros Y. Malaty
  version: "1.0.0"
  description: Public read-only bilingual commentary API. No authentication.
servers:
  - url: https://commentary.copticfaith.org
  - url: http://localhost:3000
tags:
  - { name: Meta }
  - { name: Catalog }
  - { name: Sections }
  - { name: Study }
  - { name: Search }
  - { name: References }
paths:
  /api/v1/navigation:
    get:
      tags: [Catalog]
      summary: Book, chapter and verse picker with section associations
      description: Includes all 73 catalog books. Pass book for chapters, and book plus chapter for verse positions and section summaries. Text availability is explicit.
      parameters:
        - { name: book, in: query, schema: { type: string } }
        - { name: chapter, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200": { description: Catalog and selected location navigation }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/resolve:
    get:
      tags: [References]
      summary: Resolve an English or Arabic Bible reference to bilingual verses
      description: Accepts full book names, catalog abbreviations, source book codes and slugs. Supports a chapter, a single verse or a same-chapter verse range. Arabic-Indic digits are supported. Missing bundled text is null.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 200 }, example: "John 3:16-18" }
      responses:
        "200": { description: Canonical reference, bilingual verses and API navigation links }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/scripture/search:
    get:
      tags: [Search]
      summary: Search indexed Bible words and quoted phrases in KJV or Arabic AVD
      description: Whole-token matching with AND between terms; double quotes match a phrase. Arabic search normalizes diacritics and letter variants. Results follow canonical book, chapter and verse order.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 200 }, example: '"God so loved"' }
        - { name: lang, in: query, schema: { type: string, enum: [en, ar], default: en } }
        - { name: book, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
      responses:
        "200": { description: Matching verses with references, text, translation and pagination }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /health:
    get:
      tags: [Meta]
      summary: Liveness and corpus counts
      responses:
        "200": { description: Healthy, content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/meta:
    get:
      tags: [Meta]
      summary: Corpus metadata and attribution
      responses:
        "200": { description: Metadata, content: { application/json: { schema: { $ref: "#/components/schemas/MetaResponse" } } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/books:
    get:
      tags: [Catalog]
      summary: List books
      parameters:
        - { name: testament, in: query, schema: { type: string, enum: [ot, nt] } }
      responses:
        "200": { description: Books, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/Book" } } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/books/{book}:
    get:
      tags: [Catalog]
      summary: Book detail with chapter list
      parameters: [{ $ref: "#/components/parameters/Book" }]
      responses:
        "200": { description: Book, content: { application/json: { schema: { $ref: "#/components/schemas/BookDetailResponse" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/books/{book}/chapters/{chapter}:
    get:
      tags: [Catalog]
      summary: Chapter detail and section summaries
      parameters:
        - { $ref: "#/components/parameters/Book" }
        - { name: chapter, in: path, required: true, schema: { type: string, examples: ["1", intro] } }
      responses:
        "200": { description: Chapter, content: { application/json: { schema: { $ref: "#/components/schemas/ChapterResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/books/{book}/chapters/{chapter}/scripture:
    get:
      tags: [Sections]
      summary: Chapter verses with bilingual Scripture text and commentary associations
      description: Bilingual KJV and AVD text. Missing text is null; deuterocanonical books have no bundled Scripture text. Commentary sections may cover multiple verses.
      parameters:
        - { $ref: "#/components/parameters/Book" }
        - { name: chapter, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Ordered chapter verses and translation availability
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      book: { type: string }
                      chapter: { type: integer }
                      translations:
                        type: object
                        additionalProperties:
                          type: object
                          properties:
                            id: { type: string, enum: [KJV, AVD] }
                            name: { type: string }
                            language: { type: string, enum: [en, ar] }
                            license: { type: string }
                            source: { type: string, format: uri }
                            status: { type: string, enum: [available, source_required, not_found] }
                      verses:
                        type: array
                        items:
                          type: object
                          properties:
                            number: { type: integer }
                            text:
                              type: object
                              properties:
                                en: { type: [string, "null"] }
                                ar: { type: [string, "null"] }
                            sections: { type: array, items: { type: integer } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/books/{book}/chapters/{chapter}/study:
    get:
      tags: [Study]
      summary: Chapter verses interleaved with commentary after each verse range
      description: Returns ordered blocks. Commentary sections without a verse range appear first. Each verse range is followed by one commentary block. Verse text is KJV and AVD; commentary language and format are selected by query.
      parameters:
        - { $ref: "#/components/parameters/Book" }
        - { name: chapter, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { $ref: "#/components/parameters/StudyLang" }
        - { $ref: "#/components/parameters/Format" }
      responses:
        "200":
          description: Ordered verse and commentary blocks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudyResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/books/{book}/chapters/{chapter}/verses/{verse}/commentary:
    get:
      description: The commentary array contains only individually identified verse comments. Shared range or section context is returned separately in shared_commentary with stable IDs for deduplication. commentary_status reports individual availability per language; source_commentary_status includes shared source context. Missing source content reports No commentary available. Unmarked gaps are never filled from neighboring verse comments.
      tags: [Study]
      summary: Commentary chunks for a selected verse
      parameters:
        - { $ref: "#/components/parameters/Book" }
        - { name: chapter, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: verse, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { $ref: "#/components/parameters/StudyLang" }
        - { $ref: "#/components/parameters/Format" }
      responses:
        "200":
          description: Verse text and covering commentary chunks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerseCommentaryResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/books/{book}/chapters/{chapter}/sections/{index}:
    get:
      tags: [Sections]
      summary: Section by chapter and index
      parameters:
        - { $ref: "#/components/parameters/Book" }
        - { name: chapter, in: path, required: true, schema: { type: string } }
        - { name: index, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { $ref: "#/components/parameters/Lang" }
        - { $ref: "#/components/parameters/Format" }
        - { name: parallel, in: query, description: Return both languages using the same envelope as /parallel, schema: { type: string, enum: ["1"] } }
      responses:
        "200": { description: Section, content: { application/json: { schema: { $ref: "#/components/schemas/SectionResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/sections/{id}:
    get:
      tags: [Sections]
      summary: Section by id
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { $ref: "#/components/parameters/Lang" }
        - { $ref: "#/components/parameters/Format" }
        - { name: parallel, in: query, description: Return both languages using the same envelope as /parallel, schema: { type: string, enum: ["1"] } }
      responses:
        "200": { description: Section, content: { application/json: { schema: { $ref: "#/components/schemas/SectionResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/parallel:
    get:
      tags: [Sections]
      summary: Same section in English and Arabic
      parameters:
        - { $ref: "#/components/parameters/BookQuery" }
        - { name: chapter, in: query, required: true, schema: { type: string } }
        - { name: index, in: query, required: true, schema: { type: integer, minimum: 1 } }
        - { $ref: "#/components/parameters/Format" }
      responses:
        "200": { description: Parallel section, content: { application/json: { schema: { $ref: "#/components/schemas/ParallelResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/search:
    get:
      tags: [Search]
      summary: Bilingual full-text search
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 200 } }
        - { $ref: "#/components/parameters/Lang" }
        - { name: book, in: query, schema: { type: string } }
        - { name: testament, in: query, schema: { type: string, enum: [ot, nt] } }
        - { name: chapter, in: query, schema: { type: integer, minimum: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 10000, default: 0 } }
      responses:
        "200": { description: Hits, content: { application/json: { schema: { $ref: "#/components/schemas/SearchResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/references:
    get:
      tags: [References]
      summary: Sections citing a verse
      parameters:
        - { $ref: "#/components/parameters/BookQuery" }
        - { name: chapter, in: query, required: true, schema: { type: integer, minimum: 1 } }
        - { name: verse, in: query, required: true, schema: { type: integer, minimum: 1 } }
        - { $ref: "#/components/parameters/Lang" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 10000, default: 0 } }
      responses:
        "200": { description: Sections, content: { application/json: { schema: { $ref: "#/components/schemas/ReferenceResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
components:
  parameters:
    Book:
      name: book
      in: path
      required: true
      schema: { type: string, examples: [genesis] }
    BookQuery:
      name: book
      in: query
      required: true
      schema: { type: string, examples: [genesis] }
    Lang:
      name: lang
      in: query
      schema: { type: string, enum: [en, ar], default: en }
    StudyLang:
      name: lang
      in: query
      schema: { type: string, enum: [en, ar, both], default: en }
    Format:
      name: format
      in: query
      schema: { type: string, enum: [html, markdown, both], default: html }
  responses:
    NotFound:
      description: Not found
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    BadRequest:
      description: Bad request
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema: { type: integer }
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
    Health:
      type: object
      properties:
        status: { type: string }
        service: { type: string }
        books: { type: integer }
        sections: { type: integer }
        build: { type: string }
        schema_version: { type: integer }
        checksum: { type: string }
    Book:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string }
        book_number: { type: integer }
        testament: { type: string, enum: [ot, nt] }
        name: { type: object, properties: { en: { type: string }, ar: { type: string } } }
        short: { type: object, properties: { en: { type: string }, ar: { type: string } } }
        chapters_expected: { type: integer }
    Chapter:
      type: object
      properties:
        number: { type: integer }
        title: { type: object }
        section_count: { type: integer }
        available: { type: boolean }
    Section:
      type: object
      properties:
        id: { type: integer }
        source_id: { type: string }
        lang: { type: string, enum: [en, ar] }
        book: { $ref: "#/components/schemas/Book" }
        chapter: { type: object }
        index: { type: integer }
        section_count: { type: integer }
        title: { type: object }
        verse_ranges: { type: array, items: { type: object } }
        content: { type: object, properties: { html: { type: string }, markdown: { type: string } } }
        references: { type: array, items: { type: object } }
        content_hash: { type: string }
        url: { type: string }
    StudyTranslation:
      type: object
      properties:
        id: { type: string, enum: [KJV, AVD] }
        name: { type: string }
        language: { type: string, enum: [en, ar] }
        license: { type: string }
        source: { type: string, format: uri }
        status: { type: string, enum: [available, source_required, not_found] }
    StudyVerse:
      type: object
      properties:
        number: { type: integer }
        text:
          type: object
          properties:
            en: { type: [string, "null"] }
            ar: { type: [string, "null"] }
    StudyCommentary:
      type: object
      properties:
        type: { const: commentary }
        id: { type: integer }
        index: { type: integer }
        title: { type: object, properties: { en: { type: string }, ar: { type: string } } }
        verse_ranges: { type: array, items: { type: array, items: { type: integer } } }
        content: { type: object, description: "Keyed by language, then by html and/or markdown." }
        references: { type: object, description: "Keyed by language; each value is an array of reference objects." }
        content_hash: { type: string }
        url: { type: string, format: uri }
    StudyVersesBlock:
      type: object
      properties:
        type: { const: verses }
        verses: { type: array, items: { $ref: "#/components/schemas/StudyVerse" } }
    StudyBlock:
      oneOf:
        - $ref: "#/components/schemas/StudyVersesBlock"
        - $ref: "#/components/schemas/StudyCommentary"
    StudyResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            book: { $ref: "#/components/schemas/Book" }
            chapter: { $ref: "#/components/schemas/Chapter" }
            translations:
              type: object
              properties:
                en: { $ref: "#/components/schemas/StudyTranslation" }
                ar: { $ref: "#/components/schemas/StudyTranslation" }
            blocks: { type: array, items: { $ref: "#/components/schemas/StudyBlock" } }
        meta: { type: object }
    CommentaryAvailability:
      type: object
      properties:
        available: { type: boolean }
        status: { type: string, enum: [available, not_available, shared_only] }
        message:
          type: [object, "null"]
          properties:
            en: { type: string }
            ar: { type: string }
    VerseCommentaryEntry:
      type: object
      properties:
        id: { type: integer }
        section_id: { type: integer }
        index: { type: integer }
        scope: { type: string, enum: [verse, range] }
        lang: { type: string, enum: [en, ar] }
        title: { type: object, properties: { en: { type: string }, ar: { type: string } } }
        verse_start: { type: integer }
        verse_end: { type: integer }
        content: { type: object, description: "html and/or markdown for this entry's language." }
        references: { type: array, items: { type: object } }
        content_hash: { type: string }
        url: { type: string, format: uri }
    VerseCommentaryResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            book: { $ref: "#/components/schemas/Book" }
            chapter: { $ref: "#/components/schemas/Chapter" }
            number: { type: integer }
            text:
              type: object
              properties:
                en: { type: [string, "null"] }
                ar: { type: [string, "null"] }
            translations:
              type: object
              properties:
                en: { $ref: "#/components/schemas/StudyTranslation" }
                ar: { $ref: "#/components/schemas/StudyTranslation" }
            commentary: { type: array, items: { $ref: "#/components/schemas/VerseCommentaryEntry" } }
            shared_commentary:
              type: array
              items:
                type: object
                properties:
                  id: { type: [integer, string] }
                  section_id: { type: integer }
                  lang: { type: string, enum: [en, ar] }
                  scope: { type: string, enum: [range, section] }
                  content: { type: object }
                  url: { type: string, format: uri }
            commentary_status:
              type: object
              additionalProperties: { $ref: "#/components/schemas/CommentaryAvailability" }
            source_commentary_status:
              type: object
              additionalProperties: { $ref: "#/components/schemas/CommentaryAvailability" }
        meta: { type: object }
    MetaResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            name: { type: string }
            attribution: { type: string }
            author: { type: object }
            work: { type: object }
            attribution_notice: { type: string }
            notice: { type: string }
            license: { type: string }
            books: { type: integer }
            books_total: { type: integer }
            sections: { type: integer }
            chunks: { type: object }
            ref_segments: { type: object }
            dropped_refs: { type: object }
            languages: { type: array, items: { type: string } }
            source_sha256: { type: object }
            content_checksum: { type: string }
            schema_version: { type: integer }
            build: { type: string }
    BookDetailResponse:
      type: object
      properties:
        data:
          allOf:
            - $ref: "#/components/schemas/Book"
            - type: object
              properties:
                chapters: { type: array, items: { $ref: "#/components/schemas/Chapter" } }
    ChapterResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            book: { $ref: "#/components/schemas/Book" }
            chapter: { $ref: "#/components/schemas/Chapter" }
            sections: { type: array, items: { type: object } }
    SectionResponse:
      type: object
      properties:
        data: { $ref: "#/components/schemas/Section" }
        meta: { type: object }
    ParallelResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            en: { $ref: "#/components/schemas/Section" }
            ar: { $ref: "#/components/schemas/Section" }
    SearchResponse:
      type: object
      properties:
        data: { type: array, items: { type: object } }
        meta: { type: object }
        pagination: { type: object }
    ReferenceResponse:
      type: object
      properties:
        data: { type: array, items: { type: object } }
        meta: { type: object }
        pagination: { type: object }
