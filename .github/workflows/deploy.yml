name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Trigger Coolify deployment
        id: deploy
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          COOLIFY_RESOLVE: ${{ vars.COOLIFY_RESOLVE }}
        run: |
          resolve_args=()
          if [ -n "$COOLIFY_RESOLVE" ]; then resolve_args=(--resolve "$COOLIFY_RESOLVE"); fi
          response=$(curl -fsS -X POST "${resolve_args[@]}" \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            "$COOLIFY_BASE_URL/api/v1/deploy?uuid=$COOLIFY_APP_UUID")
          echo "$response"
          uuid=$(printf '%s' "$response" | jq -r '.deployments[0].deployment_uuid // empty')
          if [ -z "$uuid" ]; then
            echo "::error::Coolify did not return a deployment UUID"
            exit 1
          fi
          echo "uuid=$uuid" >> "$GITHUB_OUTPUT"
          echo "Coolify deployment UUID: $uuid"
      - name: Wait for Coolify deployment
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_RESOLVE: ${{ vars.COOLIFY_RESOLVE }}
          DEPLOYMENT_UUID: ${{ steps.deploy.outputs.uuid }}
        run: |
          resolve_args=()
          if [ -n "$COOLIFY_RESOLVE" ]; then resolve_args=(--resolve "$COOLIFY_RESOLVE"); fi
          for i in $(seq 1 78); do
            response=$(curl -fsS "${resolve_args[@]}" \
              -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
              "$COOLIFY_BASE_URL/api/v1/deployments/$DEPLOYMENT_UUID" 2>/dev/null || true)
            status=$(printf '%s' "$response" | jq -r '.status // empty' 2>/dev/null || true)
            echo "attempt $i/78: deployment status=${status:-<unknown>}"
            case "$status" in
              finished)
                echo "Coolify deployment $DEPLOYMENT_UUID finished successfully"
                exit 0
                ;;
              failed|error|cancelled)
                echo "::error::Coolify deployment $DEPLOYMENT_UUID ended with status $status"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "::error::Timed out waiting for Coolify deployment $DEPLOYMENT_UUID"
          exit 1
      - name: Verify production
        env:
          PRODUCTION_RESOLVE: ${{ vars.PRODUCTION_RESOLVE }}
        run: |
          resolve_args=()
          if [ -n "$PRODUCTION_RESOLVE" ]; then resolve_args=(--resolve "$PRODUCTION_RESOLVE"); fi
          for i in $(seq 1 30); do
            stamp="$(date +%s)-$i"
            response=$(curl -sS --connect-timeout 10 --max-time 20 "${resolve_args[@]}" -w '\n%{http_code}' \
              -H 'Cache-Control: no-cache' \
              "https://commentary.copticfaith.org/health?ts=$stamp" 2>/dev/null || true)
            http_code=$(printf '%s' "$response" | tail -n1)
            body=$(printf '%s' "$response" | sed '$d')
            status=$(printf '%s' "$body" | jq -r '.status // empty' 2>/dev/null || true)
            books=$(printf '%s' "$body" | jq -r '.books // empty' 2>/dev/null || true)
            sections=$(printf '%s' "$body" | jq -r '.sections // empty' 2>/dev/null || true)
            schema_version=$(printf '%s' "$body" | jq -r '.schema_version // empty' 2>/dev/null || true)
            echo "attempt $i/30: HTTP ${http_code:-<none>} status=${status:-<none>} books=${books:-<none>} sections=${sections:-<none>} schema_version=${schema_version:-<none>}"
            if [ "$http_code" = "200" ] && [ "$status" = "ok" ] && \
              [ "$books" = "67" ] && [ "$sections" = "7590" ] && \
              [ "$schema_version" = "4" ]; then
              echo "production verification passed"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Production failed verification: expected HTTP 200 with status=ok, books=67, sections=7590, schema_version=4"
          exit 1
